<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="100%" height="100%">
  <defs>
    <!-- Background & Card Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)" />
    </linearGradient>

    <linearGradient id="glowAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8a1e" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glowGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ff8a1e" />
    </marker>
  </defs>

  <style>
    .title { font-family: 'Kanit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle { font-family: 'Kanit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
    .layer-label { font-family: 'Kanit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; }
    .node-title { font-family: 'Kanit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #f8fafc; }
    .node-desc { font-family: 'Kanit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
    .node-badge { font-family: 'Kanit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 10px; fill: #ffffff; }
    .conn-line { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    .conn-active { stroke: #06b6d4; stroke-width: 2; fill: none; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="840" rx="20" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="1198" height="838" rx="19" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />

  <!-- Header Section -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="38" height="38" rx="10" fill="url(#glowAmber)" />
    <text x="11" y="26" font-size="20">🛋️</text>
    <text x="50" y="20" class="title" font-size="22">Maison Forme — Microservices Architecture Overview</text>
    <text x="50" y="38" class="subtitle">สถาปัตยกรรมระบบไมโครเซอร์วิสและสแตกเทคโนโลยีสำหรับโครงงานนิสิต (อิงตามแนวคิด Netflix Architecture)</text>
    <rect x="940" y="4" width="180" height="30" rx="15" fill="rgba(255, 138, 30, 0.15)" stroke="#ff8a1e" stroke-width="1" />
    <text x="965" y="24" font-family="'Kanit', sans-serif" font-size="12" font-weight="700" fill="#ff8a1e">100% PRODUCTION READY</text>
  </g>

  <!-- ================= LAYER 1: CLIENT TIER ================= -->
  <g transform="translate(40, 100)">
    <!-- Container Box -->
    <rect width="1120" height="80" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#dropShadow)" />
    <text x="20" y="24" class="layer-label" fill="#38bdf8">1. CLIENT LAYER (WEB SPA &amp; 3D STUDIO CANVAS)</text>
    
    <!-- Client Node A -->
    <g transform="translate(40, 34)">
      <rect width="230" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="12" y="22" class="node-title">💻 Web Browser SPA</text>
      <text x="145" y="22" class="node-desc">HTML5 / ES6</text>
    </g>

    <!-- Client Node B -->
    <g transform="translate(290, 34)">
      <rect width="240" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="12" y="22" class="node-title">📱 Responsive Mobile App</text>
      <text x="170" y="22" class="node-desc">iOS Glass</text>
    </g>

    <!-- Client Node C -->
    <g transform="translate(550, 34)">
      <rect width="250" height="36" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="12" y="22" class="node-title">🎨 3D Room Studio Canvas</text>
      <text x="175" y="22" class="node-desc">Interactive 2D/3D</text>
    </g>

    <!-- Client Node D -->
    <g transform="translate(820, 34)">
      <rect width="260" height="36" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <text x="12" y="22" class="node-title">📊 Student Evaluation Tool</text>
      <text x="175" y="22" class="node-desc">100% Tracker</text>
    </g>
  </g>

  <!-- Connectors Layer 1 to 2 -->
  <path d="M 600 180 L 600 205" class="conn-active" marker-end="url(#arrowCyan)" />

  <!-- ================= LAYER 2: EDGE & API GATEWAY ================= -->
  <g transform="translate(40, 210)">
    <rect width="1120" height="88" rx="14" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" filter="url(#dropShadow)" />
    <text x="20" y="24" class="layer-label" fill="#f59e0b">2. EDGE ROUTING &amp; API GATEWAY (NETFLIX ZUUL / KONG PATTERN)</text>
    
    <!-- Edge Node 1 -->
    <g transform="translate(40, 36)">
      <rect width="240" height="40" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="12" y="25" class="node-title">🌐 CDN / Edge Cache</text>
      <text x="145" y="25" class="node-desc">Cloudflare / Static</text>
    </g>

    <!-- Edge Node 2 -->
    <g transform="translate(300, 36)">
      <rect width="250" height="40" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="12" y="25" class="node-title">🛡️ API Gateway &amp; Auth</text>
      <text x="155" y="25" class="node-desc">JWT / Rate Limit</text>
    </g>

    <!-- Edge Node 3 -->
    <g transform="translate(570, 36)">
      <rect width="250" height="40" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="12" y="25" class="node-title">⚖️ Reverse Proxy &amp; LB</text>
      <text x="155" y="25" class="node-desc">Nginx / Apache</text>
    </g>

    <!-- Edge Node 4 -->
    <g transform="translate(840, 36)">
      <rect width="240" height="40" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="12" y="25" class="node-title">⚡ Circuit Breaker</text>
      <text x="135" y="25" class="node-desc">Hystrix Pattern</text>
    </g>
  </g>

  <!-- Connectors Layer 2 to 3 -->
  <path d="M 600 298 L 600 325" class="conn-active" marker-end="url(#arrowCyan)" />

  <!-- ================= LAYER 3: MICROSERVICES DOMAIN ================= -->
  <g transform="translate(40, 330)">
    <rect width="1120" height="200" rx="14" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" filter="url(#dropShadow)" />
    <text x="20" y="24" class="layer-label" fill="#a855f7">3. CORE MICROSERVICES LAYER (DECOUPLED BUSINESS DOMAINS)</text>

    <!-- Row 1 of Services -->
    <!-- Service 1: Auth & User -->
    <g transform="translate(25, 42)">
      <rect width="250" height="66" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="14" y="24" class="node-title">👤 Auth &amp; Profile Service</text>
      <text x="14" y="44" class="node-desc">Login, Register, Session Guard</text>
      <rect x="180" y="10" width="56" height="18" rx="4" fill="rgba(139,92,246,0.3)" />
      <text x="188" y="23" class="node-badge" fill="#c4b5fd">PORT 8082</text>
    </g>

    <!-- Service 2: Product Catalog & Search -->
    <g transform="translate(295, 42)">
      <rect width="255" height="66" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="14" y="24" class="node-title">📦 Catalog &amp; Search Service</text>
      <text x="14" y="44" class="node-desc">REST API, Filtering, Category</text>
      <rect x="185" y="10" width="56" height="18" rx="4" fill="rgba(139,92,246,0.3)" />
      <text x="193" y="23" class="node-badge" fill="#c4b5fd">PORT 8083</text>
    </g>

    <!-- Service 3: 3D Studio & Room Designer -->
    <g transform="translate(570, 42)">
      <rect width="255" height="66" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" />
      <text x="14" y="24" class="node-title">🛋️ 3D Studio &amp; Customizer</text>
      <text x="14" y="44" class="node-desc">Scene State, Room Dimensions</text>
      <rect x="185" y="10" width="56" height="18" rx="4" fill="rgba(236,72,153,0.3)" />
      <text x="193" y="23" class="node-badge" fill="#f472b6">PORT 8084</text>
    </g>

    <!-- Service 4: Cart & Order Service -->
    <g transform="translate(845, 42)">
      <rect width="250" height="66" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="14" y="24" class="node-title">🛒 Cart &amp; Order Service</text>
      <text x="14" y="44" class="node-desc">Checkout, Orders, Payment Mock</text>
      <rect x="180" y="10" width="56" height="18" rx="4" fill="rgba(139,92,246,0.3)" />
      <text x="188" y="23" class="node-badge" fill="#c4b5fd">PORT 8085</text>
    </g>

    <!-- Row 2 of Services -->
    <!-- Service 5: Content & Promotion -->
    <g transform="translate(25, 120)">
      <rect width="335" height="64" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
      <text x="14" y="24" class="node-title">📰 Content &amp; Promotion Service</text>
      <text x="14" y="44" class="node-desc">Articles, Banners, Dynamic Content API</text>
      <rect x="265" y="10" width="56" height="18" rx="4" fill="rgba(59,130,246,0.3)" />
      <text x="273" y="23" class="node-badge" fill="#93c5fd">PORT 8086</text>
    </g>

    <!-- Service 6: AI Style Matcher Service -->
    <g transform="translate(385, 120)">
      <rect width="345" height="64" rx="10" fill="#1e293b" stroke="#ff8a1e" stroke-width="1.2" />
      <text x="14" y="24" class="node-title">🤖 AI Smart Match Recommendation</text>
      <text x="14" y="44" class="node-desc">Room Quiz, Matching Algorithm, Preferences</text>
      <rect x="275" y="10" width="56" height="18" rx="4" fill="rgba(255,138,30,0.3)" />
      <text x="283" y="23" class="node-badge" fill="#fdba74">PORT 8087</text>
    </g>

    <!-- Service 7: Student Evaluation & Analytics -->
    <g transform="translate(755, 120)">
      <rect width="340" height="64" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <text x="14" y="24" class="node-title">📊 Student Evaluation &amp; Metrics</text>
      <text x="14" y="44" class="node-desc">100% Rubrics, Scoring, Progress Reports</text>
      <rect x="270" y="10" width="56" height="18" rx="4" fill="rgba(16,185,129,0.3)" />
      <text x="278" y="23" class="node-badge" fill="#6ee7b7">PORT 8088</text>
    </g>
  </g>

  <!-- Connectors Layer 3 to 4 -->
  <path d="M 600 530 L 600 555" class="conn-active" marker-end="url(#arrowCyan)" />

  <!-- ================= LAYER 4: EVENT STREAMING & MESSAGE BUS ================= -->
  <g transform="translate(40, 560)">
    <rect width="1120" height="74" rx="14" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" filter="url(#dropShadow)" />
    <text x="20" y="22" class="layer-label" fill="#ec4899">4. ASYNCHRONOUS EVENT STREAMING &amp; MESSAGE BUS (APACHE KAFKA / RABBITMQ)</text>
    
    <g transform="translate(30, 32)">
      <rect width="250" height="32" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1" />
      <text x="10" y="21" class="node-title">📢 Topic: order.placed</text>
      <text x="170" y="21" class="node-desc">Notify / Inventory</text>
    </g>

    <g transform="translate(300, 32)">
      <rect width="250" height="32" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1" />
      <text x="10" y="21" class="node-title">📢 Topic: user.registered</text>
      <text x="175" y="21" class="node-desc">Welcome / Sync</text>
    </g>

    <g transform="translate(570, 32)">
      <rect width="255" height="32" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1" />
      <text x="10" y="21" class="node-title">📢 Topic: design.exported</text>
      <text x="175" y="21" class="node-desc">Analytics Engine</text>
    </g>

    <g transform="translate(845, 32)">
      <rect width="245" height="32" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
      <text x="10" y="21" class="node-title">📢 Topic: evaluation.saved</text>
      <text x="170" y="21" class="node-desc">Progress Track</text>
    </g>
  </g>

  <!-- Connectors Layer 4 to 5 -->
  <path d="M 600 634 L 600 655" class="conn-active" marker-end="url(#arrowCyan)" />

  <!-- ================= LAYER 5: POLYGLOT PERSISTENCE LAYER ================= -->
  <g transform="translate(40, 660)">
    <rect width="1120" height="88" rx="14" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" filter="url(#dropShadow)" />
    <text x="20" y="22" class="layer-label" fill="#10b981">5. POLYGLOT PERSISTENCE &amp; CACHING (NETFLIX EVCACHE PATTERN)</text>
    
    <!-- DB 1: Relational Database -->
    <g transform="translate(40, 34)">
      <rect width="240" height="42" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <text x="12" y="22" class="node-title">🗄️ MySQL 8.0 (ACID)</text>
      <text x="12" y="36" class="node-desc">Users, Orders, Products, Trans.</text>
    </g>

    <!-- DB 2: Redis In-Memory Cache -->
    <g transform="translate(310, 34)">
      <rect width="240" height="42" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.2" />
      <text x="12" y="22" class="node-title">⚡ Redis Cache (EVCache)</text>
      <text x="12" y="36" class="node-desc">Fast Sessions, Catalog Caching</text>
    </g>

    <!-- DB 3: S3 / MinIO Object Storage -->
    <g transform="translate(580, 34)">
      <rect width="240" height="42" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="12" y="22" class="node-title">🪣 S3 / MinIO Storage</text>
      <text x="12" y="36" class="node-desc">3D Assets, High-Res Images</text>
    </g>

    <!-- DB 4: ElasticSearch -->
    <g transform="translate(850, 34)">
      <rect width="230" height="42" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" />
      <text x="12" y="22" class="node-title">🔍 ElasticSearch / Lucene</text>
      <text x="12" y="36" class="node-desc">Full-text Search &amp; Indexing</text>
    </g>
  </g>

  <!-- ================= FOOTER OBSERVABILITY & DEVOPS BAR ================= -->
  <g transform="translate(40, 760)">
    <rect width="1120" height="52" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="#334155" stroke-width="1" />
    <text x="24" y="32" class="layer-label" fill="#64748b">OBSERVABILITY &amp; DEVOPS:</text>
    <text x="210" y="32" class="node-desc" fill="#94a3b8">🐳 Docker Compose / Kubernetes Cluster  •  📊 Prometheus &amp; Grafana Dashboards  •  🔍 OpenTelemetry &amp; Jaeger Tracing  •  🛡️ Chaos Monkey Testing</text>
  </g>
</svg>
